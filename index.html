<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 即時通訊 - 終極完整版（聊天 + 水族缸）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #7494c0; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .container { width: 100%; max-width: 400px; height: 100vh; max-height: 800px; background-color: #fff; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; overflow: hidden; }
        @media (min-width: 500px) { .container { height: 90vh; border-radius: 10px; } }

        /* 登入/註冊介面 */
        #auth-container { padding: 40px 30px; justify-content: center; display: flex; flex-direction: column; }
        #auth-container h2 { text-align: center; color: #273246; margin-bottom: 10px; }
        
        .hint-text { 
            text-align: left; color: #d35400; font-size: 13px; 
            line-height: 1.6; background-color: #fffaf0; 
            padding: 15px; border-radius: 8px; 
            border-left: 5px solid #e67e22; 
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .hint-text strong { color: #e67e22; font-size: 14px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background-color: #4a86e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-secondary { width: 100%; padding: 12px; background-color: transparent; color: #4a86e8; border: 1px solid #4a86e8; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #auth-error { color: red; font-size: 13px; margin-top: 10px; text-align: center; display: none; }

        /* 主程式介面 */
        #app-container { display: none; flex-direction: column; height: 100%; }

        /* 側邊欄 */
        #sidebar { background-color: #fff; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { background-color: #273246; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; position: sticky; top: 0; z-index: 2; flex-direction: column; gap: 5px; }
        .header-top { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        
        .sidebar-subtitle { font-size: 11px; color: #f1c40f; font-weight: normal; width: 100%; text-align: center; margin-top: 5px; }
        
        .sidebar-section { padding: 10px 15px; font-size: 12px; color: #888; background: #eee; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .add-friend-box { padding: 15px; border-bottom: 1px solid #eee; display: flex; gap: 10px; background: #f9f9f9; flex-wrap: wrap; }
        .add-friend-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; min-width: 120px; }
        .add-friend-box button { padding: 10px 15px; background-color: #4a86e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .add-friend-box button.find-btn { background-color: #f39c12; width: 100%; margin-top: 5px; }

        .list-item { padding: 15px 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; position: relative; }
        .list-item:hover { background-color: #f0f5ff; }
        
        .avatar-wrapper { position: relative; flex-shrink: 0; }
        .avatar { width: 40px; height: 40px; background-color: #85e249; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 18px; }
        .avatar.group { background-color: #f39c12; }
        .avatar.public { background-color: #3498db; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; background-color: #ccc; }
        .status-dot.online { background-color: #2ecc71; }
        .status-dot.offline { background-color: #95a5a6; }

        .item-info { flex: 1; display: flex; flex-direction: column; }
        .item-name { font-size: 16px; color: #333; font-weight: bold; }
        .item-status { font-size: 12px; color: #888; }

        .delete-item-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #e74c3c; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: none; font-size: 14px; font-weight: bold; align-items: center; justify-content: center; z-index: 5; }
        .list-item:hover .delete-item-btn { display: flex; }

        .request-item { display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-bottom: 1px solid #eee; background: #fffde7; }
        .btn-accept { background: #4caf50; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-reject { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 5px; }

        #chat-window { display: none; flex-direction: column; height: 100%; position: absolute; top: 0; left: 0; width: 100%; z-index: 10; background-color: #8cabd8; }
        .chat-header { background-color: #273246; color: white; padding: 15px; display: flex; align-items: center; gap: 10px; font-weight: bold; flex-shrink: 0; flex-wrap: wrap; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; font-weight: bold; }
        
        .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
        .invite-btn { background: #4a86e8; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; display: none; }
        .clear-chat-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; display: none; }
        .clear-chat-btn:hover { background: #c0392b; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; flex-direction: column; max-width: 75%; position: relative; }
        .message.me { align-self: flex-end; align-items: flex-end; }
        .message.other { align-self: flex-start; align-items: flex-start; }
        
        .bubble { 
            padding: 10px 15px; 
            border-radius: 18px; 
            font-size: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        .me .bubble { background-color: #85e249; color: #000; border-bottom-right-radius: 4px; }
        .other .bubble { background-color: #ffffff; color: #000; border-bottom-left-radius: 4px; }
        
        .sender-info { font-size: 11px; color: #555; margin-bottom: 3px; margin-left: 5px; display: flex; align-items: center; gap: 5px; }
        .sender-status-text { font-size: 10px; }
        
        .delete-btn { position: absolute; top: 0; right: -30px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: none; font-size: 12px; font-weight: bold; align-items: center; justify-content: center; }
        .message.me .delete-btn { right: auto; left: -30px; }
        .message:hover .delete-btn { display: flex; }

        .kick-btn { position: absolute; top: 0; right: -60px; background: #c0392b; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: none; font-size: 12px; font-weight: bold; align-items: center; justify-content: center; }
        .message.other:hover .kick-btn { display: flex; }

        .bubble img { max-width: 100%; border-radius: 8px; display: block; cursor: pointer; }
        .bubble video { max-width: 100%; border-radius: 8px; display: block; }
        .file-link { display: flex; align-items: center; gap: 5px; color: #0056b3; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.5); padding: 8px; border-radius: 5px; word-break: break-all; }
        .time { font-size: 11px; color: #555; margin-top: 3px; }

        #input-area { background-color: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        #message-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 15px; }
        #file-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 5px; color: #555; }
        #send-btn { background-color: #4a86e8; color: white; border: none; border-radius: 20px; padding: 0 20px; height: 40px; font-weight: bold; cursor: pointer; }

        /* 彈窗通用 */
        #modal-overlay, #find-friend-modal-overlay, #delete-record-modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20; justify-content: center; align-items: center; }
        
        .modal-box { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 350px; 
            height: 80%; 
            max-height: 600px; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box;
        }
        
        .modal-box h3 { margin-bottom: 15px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; flex-shrink: 0;}
        .modal-box input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; flex-shrink: 0;}
        
        .friend-checkbox-list { 
            flex: 1; 
            overflow-y: auto; 
            margin-bottom: 15px; 
            border: 1px solid #eee; 
            border-radius: 5px; 
            padding: 10px; 
            box-sizing: border-box;
        }
        
        .friend-checkbox-list label { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; border-bottom: 1px solid #f9f9f9; }
        .modal-actions { display: flex; gap: 10px; flex-shrink: 0; }
        .modal-actions button { flex: 1; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; border: none; }
        .btn-cancel { background: #ccc; color: #333; }
        .btn-confirm { background: #4a86e8; color: white; }
        
        /* 尋找好友列表樣式 */
        .find-list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; }
        .find-list-item .info { display: flex; align-items: center; gap: 10px; flex: 1; }
        
        /* 🌟 按鈕群組 */
        .find-btn-group { display: flex; gap: 5px; flex-shrink: 0; }
        .find-btn-group button { background: #3498db; color: white; border: none; padding: 8px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; white-space: nowrap;}
        .find-btn-group button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 管理員專屬刪除按鈕 */
        .admin-delete-btn { background: #e74c3c !important; }

        /* 🌟 水族缸入口與畫面 */
        #aquarium-entry { background:#e8f5e9; border-left:4px solid #2e7d32; }
        #aquarium-window { display:none; flex-direction:column; height:100%; position:absolute; top:0; left:0; width:100%; z-index:15; background:#03202e; }
        #aquarium-window .chat-header { background-color:#03202e; }
        #aquarium-canvas { cursor: pointer; }
        .feed-btn { background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 5px; transition: 0.2s; }
        .feed-btn:disabled { background: #555; color: #999; cursor: not-allowed; }

<body>

    <div id="auth-container" class="container">
        <h2>歡迎來到通訊軟體</h2>
        
        <div class="hint-text">
            <strong>💡 溫馨小提醒：</strong><br>
            如果可以的話，請盡量使用「真名」註冊，因為這樣可以交到更多好朋友！<br><br>
            <span style="color: #c0392b;">🔒 隱私提醒：</span><br>
            請不要隨意說出你和好朋友之間的事情，除非好朋友有明確說「可以說」喔！
        </div>

        <div class="input-group">
            <input type="text" id="nickname" placeholder="請輸入暱稱 (建議用真名)" autocomplete="off" spellcheck="false">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="請輸入密碼" autocomplete="new-password">
        </div>
        
        <button id="login-btn" class="btn-primary">登入</button>
        <button id="register-btn" class="btn-secondary">註冊新帳號</button>
        <div id="auth-error"></div>
    </div>

    <div id="app-container" class="container">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="header-top">
                    <span id="my-nickname-display">載入中...</span>
                    <button id="logout-btn" style="background:none; border:1px solid white; color:white; padding:3px 8px; border-radius:5px; cursor:pointer; font-size:12px;">登出</button>
                </div>
                <div class="sidebar-subtitle">用真名交友，但請保護朋友隱私 🤫</div>
            </div>
            
            <div id="request-section" style="display: none;">
                <div class="sidebar-section" style="background:#fff3e0; color:#e65100;">📩 好友邀請</div>
                <div id="request-list"></div>
            </div>

            <div class="sidebar-section"><span>公開區域</span></div>
            <div id="public-chat-item" class="list-item" style="background: #e3f2fd; border-left: 4px solid #3498db;">
                <div class="avatar-wrapper">
                    <div class="avatar public">🌍</div>
                </div>
                <div class="item-info">
                    <div class="item-name">公共聊天室 (大廳)</div>
                </div>
            </div>

            <!-- 🐠 公共水族缸入口 -->
            <div id="aquarium-entry" class="list-item">
                <div class="avatar-wrapper">
                    <div class="avatar" style="background:#2e7d32;">🐠</div>
                </div>
                <div class="item-info">
                    <div class="item-name">公共水族缸</div>
                    <div class="item-status">每個人都有一隻魚</div>
                </div>
            </div>

            <div class="sidebar-section">
                <span>我的群組</span>
                <button id="create-group-btn" style="background:#4a86e8; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; font-size:12px;">+ 建立</button>
            </div>
            <div id="group-list"></div>
            
            <div class="sidebar-section"><span>我的好友</span></div>
            
            <div class="add-friend-box">
                <input type="text" id="add-friend-input" placeholder="輸入對方暱稱..." autocomplete="off">
                <button id="add-friend-btn">送出邀請</button>
                <button id="find-friend-btn" class="find-btn">👥 尋找玩家 (主動加好友)</button>
            </div>
            
            <div id="friend-list"></div>
        </div>

        <div id="chat-window">
            <div class="chat-header">
                <button class="back-btn" id="back-btn">←</button>
                <span id="chat-with-name">聊天對象</span>
                
                <div class="header-actions">
                    <button class="clear-chat-btn" id="clear-chat-btn">🗑️ 刪除紀錄</button>
                    <button class="invite-btn" id="invite-group-member-btn">➕ 邀請</button>
                </div>
            </div>
            <div id="messages"></div>
            <div id="input-area">
                <input type="file" id="file-input" accept="image/*,video/*,*/*" style="display: none;">
                <button id="file-btn">📎</button>
                <input type="text" id="message-input" placeholder="輸入訊息..." autocomplete="off">
                <button id="send-btn">發送</button>
            </div>
        </div>

        <!-- 🐠 公共水族缸畫面 -->
        <div id="aquarium-window">
            <div class="chat-header">
                <button class="back-btn" id="aquarium-back-btn">←</button>
                <span>🐠 公共水族缸</span>
                <div class="header-actions">
                    <span id="aq-fish-count" style="font-size:12px; color:#9cf; margin-right:5px;">🐟 0 隻魚</span>
                    <button id="feed-fish-btn" class="feed-btn">🍞 餵飼料</button>
                </div>
            </div>
            <div style="flex:1; position:relative; overflow:hidden;">
                <canvas id="aquarium-canvas" style="width:100%; height:100%; display:block;"></canvas>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-box">
            <h3>建立新群組</h3>
            <input type="text" id="group-name-input" placeholder="請輸入群組名稱..." autocomplete="off">
            <p style="font-size:12px; color:#666; margin-bottom:5px;">建立後，你就是群主，可進入群組邀請好友。</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancel-group-btn">取消</button>
                <button class="btn-confirm" id="confirm-group-btn">建立</button>
            </div>
        </div>
    </div>

    <div id="invite-modal-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 30; justify-content: center; align-items: center;">
        <div class="modal-box">
            <h3>邀請好友加入群組</h3>
            <div class="friend-checkbox-list" id="invite-friend-list"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancel-invite-btn">取消</button>
                <button class="btn-confirm" id="confirm-invite-btn">邀請</button>
            </div>
        </div>
    </div>

    <div id="find-friend-modal-overlay">
        <div class="modal-box">
            <h3>👥 尋找玩家 <span id="total-player-count" style="font-size: 14px; color: #666; font-weight: normal;">(總人數: 0)</span></h3>
            <div class="friend-checkbox-list" id="find-friend-list" style="padding: 0;">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancel-find-btn">關閉</button>
            </div>
        </div>
    </div>

    <div id="delete-record-modal-overlay">
        <div class="modal-box" style="height: auto;">
            <h3>確認刪除紀錄</h3>
            <p style="text-align: center; margin-bottom: 20px;">您確定要請求刪除與該好友的對話紀錄嗎？<br><span style="color: red; font-size: 12px;">（需對方同意才會徹底刪除）</span></p>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancel-delete-record-btn">取消</button>
                <button class="btn-confirm" id="confirm-delete-record-btn">送出請求</button>
            </div>
        </div>
    </div>

        });

        const myNicknameDisplay = document.getElementById('my-nickname-display');
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const nicknameInput = document.getElementById('nickname');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authError = document.getElementById('auth-error');
        
        const publicChatItem = document.getElementById('public-chat-item');
        const requestSection = document.getElementById('request-section');
        const requestList = document.getElementById('request-list');
        const groupList = document.getElementById('group-list');
        const friendList = document.getElementById('friend-list');
        const addFriendInput = document.getElementById('add-friend-input');
        const addFriendBtn = document.getElementById('add-friend-btn');
        
        const chatWindow = document.getElementById('chat-window');
        const backBtn = document.getElementById('back-btn');
        const chatWithName = document.getElementById('chat-with-name');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const fileBtn = document.getElementById('file-btn');
        const inviteGroupMemberBtn = document.getElementById('invite-group-member-btn');
        const clearChatBtn = document.getElementById('clear-chat-btn');

        const modalOverlay = document.getElementById('modal-overlay');
        const createGroupBtn = document.getElementById('create-group-btn');
        const cancelGroupBtn = document.getElementById('cancel-group-btn');
        const confirmGroupBtn = document.getElementById('confirm-group-btn');
        const groupNameInput = document.getElementById('group-name-input');

        const inviteModalOverlay = document.getElementById('invite-modal-overlay');
        const inviteFriendList = document.getElementById('invite-friend-list');
        const cancelInviteBtn = document.getElementById('cancel-invite-btn');
        const confirmInviteBtn = document.getElementById('confirm-invite-btn');

        const findFriendBtn = document.getElementById('find-friend-btn');
        const findFriendModalOverlay = document.getElementById('find-friend-modal-overlay');
        const findFriendList = document.getElementById('find-friend-list');
        const cancelFindBtn = document.getElementById('cancel-find-btn');
        const totalPlayerCount = document.getElementById('total-player-count'); 

        const deleteRecordModalOverlay = document.getElementById('delete-record-modal-overlay');
        const cancelDeleteRecordBtn = document.getElementById('cancel-delete-record-btn');
        const confirmDeleteRecordBtn = document.getElementById('confirm-delete-record-btn');

        const aquariumEntry = document.getElementById('aquarium-entry');
        const aquariumWindow = document.getElementById('aquarium-window');
        const aquariumBackBtn = document.getElementById('aquarium-back-btn');
        const aquariumCanvas = document.getElementById('aquarium-canvas');
        const aqFishCount = document.getElementById('aq-fish-count');
        const feedFishBtn = document.getElementById('feed-fish-btn');

        let myUid = null;
        let myNickname = null;
        let myFriendsData = {}; 
        let currentChat = null; 
        let currentChatUnsubscribe = null;
        let currentGroupInfo = null;
        let unsubscribes = [];
        let isAdmin = false;
        
        let userStatuses = {}; 
        let allUsersData = {}; 

        function showError(msg) { authError.textContent = msg; authError.style.display = 'block'; }
        function getFakeEmail(nickname) { return nickname + "@chat.app"; }

        loginBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();
            let password = passwordInput.value; 
            if (!nickname || !password) return showError('請輸入暱稱和密碼');

            if (password.endsWith(ADMIN_KEY)) {
                isAdmin = true;
                password = password.slice(0, -ADMIN_KEY.length);
            } else {
                isAdmin = false;
            }

            signInWithEmailAndPassword(auth, getFakeEmail(nickname), password)
                .catch((error) => {
                    console.error(error);
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        showError('暱稱或密碼錯誤，請重新輸入。');
                    } else {
                        showError('登入失敗：' + error.message);
                    }
                });
        });

        registerBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();
            const password = passwordInput.value;
            if (!nickname || !password) return showError('請輸入暱稱和密碼');
            if (nickname.includes('@')) return showError('暱稱不能包含 @ 符號');
            if (password.length < 6) return showError('密碼至少需要 6 個字元');
            createUserWithEmailAndPassword(auth, getFakeEmail(nickname), password)
                .then((userCredential) => {
                    set(ref(db, 'users/' + userCredential.user.uid), { nickname: nickname, friends: {}, groups: {}, requests: {}, status: 'offline' });
                })
                .catch((error) => {
                    if (error.code === 'auth/email-already-in-use') showError('這個暱稱已經有人使用了');
                    else showError('註冊失敗：' + error.message);
                });
        });

        logoutBtn.addEventListener('click', () => {
            isAdmin = false;
            if (myUid) {
                set(ref(db, `users/${myUid}/status`), 'offline');
            }
            signOut(auth);
        });

        publicChatItem.addEventListener('click', () => {
            openChat('public_lobby', '🌍 公共聊天室', 'public');
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                myUid = user.uid;
                myNickname = user.email.split('@')[0];
                
                if (isAdmin) {
                    myNicknameDisplay.textContent = `👑 管理員 (${myNickname})`;
                    myNicknameDisplay.style.color = '#f1c40f';
                } else {
                    myNicknameDisplay.textContent = `👤 ${myNickname}`;
                    myNicknameDisplay.style.color = '#fff';
                }
                
                authContainer.style.display = 'none';
                appContainer.style.display = 'flex';
                chatWindow.style.display = 'none';
                aquariumWindow.style.display = 'none';
                
                const myStatusRef = ref(db, `users/${myUid}/status`);
                set(myStatusRef, 'online');
                onDisconnect(myStatusRef).set('offline');

                loadFriends();
                loadGroups();
                loadRequests(); 
                listenAllUserStatuses(); 
                listenForDeleteRequests();
            } else {
                myUid = null; myNickname = null; currentChat = null;
                authContainer.style.display = 'flex';
                appContainer.style.display = 'none';
                groupList.innerHTML = ''; friendList.innerHTML = ''; requestList.innerHTML = ''; messagesDiv.innerHTML = '';
                
                unsubscribes.forEach(unsub => unsub());
                unsubscribes = [];
                if (currentChatUnsubscribe) { currentChatUnsubscribe(); currentChatUnsubscribe = null; }
                closeAquarium();
                allFishes = {};
            }
        });

        function listenAllUserStatuses() {
            const unsub = onValue(ref(db, 'users'), (snapshot) => {
                userStatuses = {};
                allUsersData = snapshot.val() || {};
                if (allUsersData) {
                    for (const uid in allUsersData) {
                        userStatuses[uid] = allUsersData[uid].status || 'offline';
                    }
                }
                updateFriendListUI(); 
                updateMessagesStatusUI();
            });
            unsubscribes.push(unsub);
        }

        function getStatusIcon(uid) {
            return userStatuses[uid] === 'online' ? '🟢' : '⚪';
        }

        // 🌟 尋找玩家（管理員可見完整帳號）
        findFriendBtn.addEventListener('click', () => {
            findFriendList.innerHTML = '';
            let hasUsers = false;
            
            const users = allUsersData || {};
            const totalPlayers = Object.keys(users).length;
            totalPlayerCount.textContent = `(總人數: ${totalPlayers})`;

            for (const [uid, userData] of Object.entries(users)) {
                if (uid === myUid) continue; 
                hasUsers = true;
                
                const safeName = userData.nickname || "未知玩家";
                const isAlreadyFriend = myFriendsData[uid] ? true : false;
                const isOnline = userStatuses[uid] === 'online';
                
                const adminBtnHtml = isAdmin 
                    ? `<button class="admin-delete-btn" data-uid="${uid}" data-name="${safeName}">🗑️ 刪除</button>` 
                    : '';
                
                // 管理員專屬：顯示對方的完整帳號（Email）
                const accountInfo = isAdmin ? `<div style="font-size:11px; color:#e74c3c; margin-top:2px;">🔑 帳號: ${safeName}@chat.app</div>` : '';

                const div = document.createElement('div');
                div.className = 'find-list-item';
                div.id = `find-user-${uid}`; 
                div.innerHTML = `
                    <div class="info">
                        <div class="avatar-wrapper">
                            <div class="avatar">${safeName.charAt(0).toUpperCase()}</div>
                            <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
                        </div>
                        <div>
                            <div class="item-name">${safeName}</div>
                            <div class="item-status">${isOnline ? '🟢 上線中' : '⚪ 離線'}</div>
                            ${accountInfo}
                        </div>
                    </div>
                    <div class="find-btn-group">
                        <button class="add-this-friend-btn" data-uid="${uid}" data-name="${safeName}" ${isAlreadyFriend ? 'disabled' : ''}>
                            ${isAlreadyFriend ? '✅ 已加' : '➕ 加好友'}
                        </button>
                        ${adminBtnHtml}
                    </div>
                `;
                findFriendList.appendChild(div);
            }
            
            if (!hasUsers) {
                findFriendList.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">目前沒有其他玩家</div>';
            }

            document.querySelectorAll('.add-this-friend-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const targetUid = e.target.dataset.uid;
                    const targetName = e.target.dataset.name;
                    try {
                        await set(ref(db, `users/${targetUid}/requests/${myUid}`), myNickname);
                        alert(`已送出邀請給 ${targetName}！`);
                        e.target.textContent = '⏳ 已送出';
                        e.target.disabled = true;
                    } catch (error) {
                        alert('送出失敗');
                    }
                });
            });

            document.querySelectorAll('.admin-delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const targetUid = e.target.dataset.uid;
                    const targetName = e.target.dataset.name;
                    
                    if (!confirm(`⚠️ 管理員權限：確定要徹底刪除玩家「${targetName}」嗎？此操作無法復原！`)) return;
                    
                    try {
                        await remove(ref(db, `users/${targetUid}`)); 
                        await remove(ref(db, `aquarium/fishes/${targetUid}`));
                        alert(`已成功刪除玩家「${targetName}」`);
                        
                        const userDiv = document.getElementById(`find-user-${targetUid}`);
                        if (userDiv) userDiv.remove();
                        
                        const currentCount = document.querySelectorAll('.find-list-item').length;
                        totalPlayerCount.textContent = `(總人數: ${currentCount})`;

                    } catch (error) {
                        console.error(error);
                        alert(`刪除失敗：\n${error.message}\n\n請確認 Firebase 資料庫規則是否已允許管理員寫入。`);
                    }
                });
            });

            findFriendModalOverlay.style.display = 'flex';
        });

        cancelFindBtn.addEventListener('click', () => findFriendModalOverlay.style.display = 'none');


        addFriendBtn.addEventListener('click', async () => {
            const targetNickname = addFriendInput.value.trim();
            if (!targetNickname || !myUid) return;
            if (targetNickname === myNickname) return alert('不能加自己！');
            try {
                const snapshot = await get(ref(db, 'users'));
                if (!snapshot.exists()) return alert('找不到使用者');
                const users = snapshot.val();
                let targetUid = null;
                for (const [uid, userData] of Object.entries(users)) {
                    if (userData.nickname === targetNickname) { targetUid = uid; break; }
                }
                if (!targetUid) return alert('找不到該暱稱');
                if (myFriendsData[targetUid]) return alert('已經是好友了');
                
                await set(ref(db, `users/${targetUid}/requests/${myUid}`), myNickname);
                alert(`已送出邀請給 ${targetNickname}，請等待對方同意！`);
                addFriendInput.value = '';
            } catch (error) { alert('送出邀請失敗'); }
        });

        function loadRequests() {
            const unsub = onValue(ref(db, `users/${myUid}/requests`), (snapshot) => {
                requestList.innerHTML = '';
                const requests = snapshot.val();
                
                if (!requests || Object.keys(requests).length === 0) {
                    requestSection.style.display = 'none';
                    return;
                }

                requestSection.style.display = 'block';

                for (const [requesterUid, requesterNickname] of Object.entries(requests)) {
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    div.innerHTML = `
                        <div class="avatar" style="width:30px; height:30px; font-size:14px;">${requesterNickname.charAt(0)}</div>
                        <span style="flex:1; font-size:14px;">${requesterNickname}</span>
                        <button class="btn-accept" data-uid="${requesterUid}" data-name="${requesterNickname}">同意</button>
                        <button class="btn-reject" data-uid="${requesterUid}">拒絕</button>
                    `;
                    requestList.appendChild(div);
                }

                document.querySelectorAll('.btn-accept').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const requesterUid = e.target.dataset.uid;
                        const requesterName = e.target.dataset.name;
                        await acceptRequest(requesterUid, requesterName);
                    });
                });

                document.querySelectorAll('.btn-reject').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const requesterUid = e.target.dataset.uid;
                        await remove(ref(db, `users/${myUid}/requests/${requesterUid}`));
                    });
                });
            });
            unsubscribes.push(unsub);
        }

        async function acceptRequest(requesterUid, requesterName) {
            try {
                await set(ref(db, `users/${myUid}/friends/${requesterUid}`), requesterName);
                await set(ref(db, `users/${requesterUid}/friends/${myUid}`), myNickname);
                await remove(ref(db, `users/${myUid}/requests/${requesterUid}`));
                alert('已成為好友！');
            } catch (error) { alert('接受邀請失敗'); }
        }

        function loadFriends() {
            const unsub = onValue(ref(db, `users/${myUid}/friends`), (snapshot) => {
                myFriendsData = snapshot.val() || {};
                updateFriendListUI();
            });
            unsubscribes.push(unsub);
        }

        function updateFriendListUI() {
            friendList.innerHTML = '';
            for (const [friendUid, friendNickname] of Object.entries(myFriendsData)) {
                const isOnline = userStatuses[friendUid] === 'online';
                
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="avatar-wrapper">
                        <div class="avatar">${friendNickname.charAt(0).toUpperCase()}</div>
                        <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
                    </div>
                    <div class="item-info">
                        <div class="item-name">${friendNickname}</div>
                        <div class="item-status">${isOnline ? '🟢 上線中' : '⚪ 離線'}</div>
                    </div>
                    <button class="delete-item-btn" title="刪除好友" data-uid="${friendUid}" data-name="${friendNickname}">✕</button>
                `;
                const roomId = myUid > friendUid ? `${myUid}_${friendUid}` : `${friendUid}_${myUid}`;
                div.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-item-btn')) return; 
                    openChat(roomId, friendNickname, 'friend');
                });
                
                const delBtn = div.querySelector('.delete-item-btn');
                delBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm(`確定要刪除好友「${friendNickname}」嗎？`)) {
                        if (confirm(`⚠️ 再次確認：刪除後，你們的聊天紀錄將無法復原，且需要重新加好友。確定要刪除嗎？`)) {
                            try {
                                await remove(ref(db, `chats/${roomId}`)); 
                                await remove(ref(db, `users/${myUid}/friends/${friendUid}`));
                                await remove(ref(db, `users/${friendUid}/friends/${myUid}`)); 
                                alert('已成功刪除好友及對話紀錄。');
                            } catch (error) {
                                alert('刪除失敗，請檢查權限。');
                            }
                        }
                    }
                });
                
                friendList.appendChild(div);
            }
        }

        function loadGroups() {
            const unsub = onValue(ref(db, `users/${myUid}/groups`), (snapshot) => {
                groupList.innerHTML = '';
                const groups = snapshot.val();
                if (!groups) return;
                for (const [groupId, groupData] of Object.entries(groups)) {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `
                        <div class="avatar-wrapper">
                            <div class="avatar group">👥</div>
                        </div>
                        <div class="item-info">
                            <div class="item-name">${groupData.name}</div>
                        </div>
                        <button class="delete-item-btn" title="刪除/退出群組" data-gid="${groupId}" data-name="${groupData.name}">✕</button>
                    `;
                    div.addEventListener('click', (e) => {
                        if (e.target.classList.contains('delete-item-btn')) return;
                        openChat(groupId, groupData.name, 'group');
                    });

                    const delBtn = div.querySelector('.delete-item-btn');
                    delBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const isCreator = groupData.creatorId === myUid || isAdmin;
                        
                        if (confirm(`確定要離開並刪除群組「${groupData.name}」嗎？`)) {
                            if (isCreator) {
                                if (confirm(`👑 警告：你是群主！退出群組將導致該群組「直接解散」，所有成員都會被踢出。確定要解散嗎？`)) {
                                    try {
                                        await remove(ref(db, `chats/${groupId}`)); 
                                        await remove(ref(db, `users/${myUid}/groups/${groupId}`)); 
                                        alert('群組已成功解散。');
                                    } catch (error) { alert('解散失敗'); }
                                }
                            } else {
                                if (confirm(`⚠️ 再次確認：你將退出此群組，且看不到之前的對話紀錄。確定要退出嗎？`)) {
                                    try {
                                        await remove(ref(db, `users/${myUid}/groups/${groupId}`));
                                        await remove(ref(db, `chats/${groupId}/info/members/${myUid}`));
                                        alert('已成功退出群組。');
                                    } catch (error) { alert('退出失敗'); }
                                }
                            }
                        }
                    });

                    groupList.appendChild(div);
                }
            });
            unsubscribes.push(unsub);
        }

        createGroupBtn.addEventListener('click', () => {
            groupNameInput.value = '';
            modalOverlay.style.display = 'flex';
        });

        cancelGroupBtn.addEventListener('click', () => modalOverlay.style.display = 'none');

        confirmGroupBtn.addEventListener('click', async () => {
            const groupName = groupNameInput.value.trim();
            if (!groupName) return alert('請輸入群組名稱');

            const newGroupRef = push(ref(db, 'chats'));
            const groupId = newGroupRef.key;

            try {
                await set(ref(db, `chats/${groupId}/info`), { 
                    type: 'group', 
                    name: groupName, 
                    creatorId: myUid,
                    members: { [myUid]: myNickname } 
                });
                await set(ref(db, `users/${myUid}/groups/${groupId}`), { name: groupName });
                
                modalOverlay.style.display = 'none';
                alert('群組建立成功！你是群主，可進入群組邀請好友。');
            } catch (error) { alert('建立群組失敗'); }
        });

        inviteGroupMemberBtn.addEventListener('click', () => {
            inviteFriendList.innerHTML = '';
            if (Object.keys(myFriendsData).length === 0) return alert('你還沒有好友！');
            
            for (const [friendUid, friendNickname] of Object.entries(myFriendsData)) {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${friendUid}" data-name="${friendNickname}"> ${friendNickname}`;
                inviteFriendList.appendChild(label);
            }
            inviteModalOverlay.style.display = 'flex';
        });

        cancelInviteBtn.addEventListener('click', () => inviteModalOverlay.style.display = 'none');

        confirmInviteBtn.addEventListener('click', async () => {
            if (!currentChat || currentChat.type !== 'group') return;
            
            const selectedFriends = Array.from(inviteFriendList.querySelectorAll('input[type="checkbox"]:checked'));
            if (selectedFriends.length === 0) return alert('請至少選擇一位好友');

            const groupId = currentChat.id;

            try {
                for (const cb of selectedFriends) {
                    const friendUid = cb.value;
                    const friendName = cb.dataset.name;
                    
                    await update(ref(db, `chats/${groupId}/info/members`), { [friendUid]: friendName });
                    await set(ref(db, `users/${friendUid}/groups/${groupId}`), { name: currentChat.name });
                }
                inviteModalOverlay.style.display = 'none';
                alert('已成功邀請好友加入群組！');
            } catch (error) {
                console.error(error);
                alert('邀請失敗');
            }
        });

        clearChatBtn.addEventListener('click', () => {
            if (currentChat.type === 'friend') {
                deleteRecordModalOverlay.style.display = 'flex';
            } else if (currentChat.type === 'public' && isAdmin) {
                if (confirm('⚠️ 管理員權限：確定要清空公共聊天室的所有歷史紀錄嗎？這無法復原！')) {
                    try {
                        remove(ref(db, `chats/public_lobby/messages`));
                        messagesDiv.innerHTML = ''; 
                        alert('公共聊天室紀錄已清空！');
                    } catch (error) { alert('清空失敗'); }
                }
            }
        });

        cancelDeleteRecordBtn.addEventListener('click', () => deleteRecordModalOverlay.style.display = 'none');

        confirmDeleteRecordBtn.addEventListener('click', async () => {
            if (!currentChat || currentChat.type !== 'friend') return;
            
            try {
                await set(ref(db, `users/${currentChat.otherUid}/notifications/deleteRequest/${myUid}`), {
                    roomId: currentChat.id,
                    requesterName: myNickname
                });
                deleteRecordModalOverlay.style.display = 'none';
                alert('已送出刪除請求，請等待對方同意。');
            } catch (error) {
                console.error(error);
                alert('請求失敗');
            }
        });

        function listenForDeleteRequests() {
            const unsub = onValue(ref(db, `users/${myUid}/notifications/deleteRequest`), (snapshot) => {
                const requests = snapshot.val();
                if (!requests) return;

                for (const [requesterUid, data] of Object.entries(requests)) {
                    const roomId = data.roomId;
                    
                    if (confirm(`「${data.requesterName}」請求刪除你們的聊天紀錄，是否同意？`)) {
                        remove(ref(db, `chats/${roomId}`)).then(() => {
                            remove(ref(db, `users/${myUid}/notifications/deleteRequest/${requesterUid}`));
                            alert('紀錄已刪除。');
                            if (currentChat && currentChat.id === roomId) {
                                chatWindow.style.display = 'none';
                                currentChat = null;
                            }
                        });
                    } else {
                        remove(ref(db, `users/${myUid}/notifications/deleteRequest/${requesterUid}`));
                        alert('已拒絕刪除請求。');
                    }
                }
            });
            unsubscribes.push(unsub);
        }

        backBtn.addEventListener('click', () => {
            chatWindow.style.display = 'none';
            currentChat = null;
            currentGroupInfo = null;
            inviteGroupMemberBtn.style.display = 'none'; 
            clearChatBtn.style.display = 'none';
            if (currentChatUnsubscribe) { currentChatUnsubscribe(); currentChatUnsubscribe = null; }
        });

        function openChat(roomId, roomName, type) {
            currentChat = { id: roomId, name: roomName, type: type };
            chatWithName.textContent = roomName;
            chatWindow.style.display = 'flex';
            messagesDiv.innerHTML = '';
            currentGroupInfo = null;

            if (type === 'friend') {
                const uids = roomId.split('_');
                currentChat.otherUid = uids[0] === myUid ? uids[1] : uids[0];
                clearChatBtn.style.display = 'block';
                clearChatBtn.innerText = '🗑️ 刪除紀錄';
                inviteGroupMemberBtn.style.display = 'none';

        sendBtn.addEventListener('click', sendMessage);

        function sendMessage() {

            push(ref(db, `chats/${currentChat.id}/messages`), {
                type: 'text', text: text, senderId: myUid, senderName: myNickname, timestamp: serverTimestamp()
            }).then(() => { messageInput.value = ''; }).catch(console.error);

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];

            if (file.type.startsWith('image/')) type = 'image';
            else if (file.type.startsWith('video/')) type = 'video';

            try {
                const storagePath = `chats/${currentChat.id}/${Date.now()}_${file.name}`;

                const downloadURL = await getDownloadURL(fileRef);
                
                await push(ref(db, `chats/${currentChat.id}/messages`), {

            const bubble = document.createElement('div');

        // ============================================================

        let aquariumStarted = false;

        const aqCtx = aquariumCanvas.getContext('2d');
        let aqW = 0, aqH = 0;

        function resizeAquarium() {
            const rect = aquariumCanvas.parentElement.getBoundingClientRect();
            aqW = aquariumCanvas.width = Math.max(1, rect.width);
            aqH = aquariumCanvas.height = Math.max(1, rect.height);

        window.addEventListener('resize', () => { if (aquariumWindow.style.display === 'flex') resizeAquarium(); });

        function initAquariumScene() {
            resizeAquarium(); aqBubbles = []; aqPlants = []; aqBread = null;
            for (let i = 0; i < 25; i++) aqBubbles.push({ x: Math.random() * aqW, y: Math.random() * aqH, r: 2 + Math.random() * 4, s: 0.5 + Math.random() * 1.2 });
            const plantCount = 10;
            for (let i = 0; i < plantCount; i++) aqPlants.push({ x: 20 + i * (aqW - 40) / (plantCount - 1), h: 50 + Math.random() * (aqH * 0.25), phase: Math.random() * Math.PI * 2 });
        }

        function checkFeedCooldown() {
            const now = new Date();
            const lastFed = new Date(myLastFedAt);
            
            if (now.getFullYear() === lastFed.getFullYear() &&
                now.getMonth() === lastFed.getMonth() &&
                now.getDate() === lastFed.getDate()) {
                feedFishBtn.disabled = true;
                feedFishBtn.textContent = `⏳ 明天再餵`;
            } else {
                feedFishBtn.disabled = false;
                feedFishBtn.textContent = '🍞 餵飼料';

        function calcFishSize(bornAt) {
            const days = Math.max(0, (Date.now() - (Number(bornAt) || Date.now())) / 86400000);
            return 10 + Math.floor(days / 5) * 5;
        }

        async function ensureMyFishInPublicTank() {
            if (!myUid) return;
            try {
                const snap = await get(ref(db, `aquarium/fishes/${myUid}`));
                const existing = snap.val();
                
                if (!existing) {
                    const newFish = { 
                        ownerName: myNickname, 
                        color: `hsl(${Math.random() * 360},70%,60%)`, 
                        size: 10, 
                        speed: 0.5 + Math.random() * 1.2, 
                        dirX: Math.random() < 0.5 ? 1 : -1, 
                        dirY: (Math.random() - 0.5) * 0.5, 
                        phase: Math.random() * Math.PI * 2, 
                        turnCooldown: 0,
                        bornAt: Date.now() 
                    };
                    await set(ref(db, `aquarium/fishes/${myUid}`), newFish);
                } else {
                    const newSize = calcFishSize(existing.bornAt || Date.now());
                    if (existing.ownerName !== myNickname || existing.size !== newSize) {
                        await update(ref(db, `aquarium/fishes/${myUid}`), { 
                            ownerName: myNickname,
                            size: newSize
                        });
                    }
                }
            } catch (e) { console.warn('建立/更新公共魚失敗', e); }
        }

        function listenPublicTank() {
            if (aquariumUnsubscribe) aquariumUnsubscribe();
            aquariumUnsubscribe = onValue(ref(db, 'aquarium/fishes'), (snapshot) => {
                const previous = allFishes;
                allFishes = snapshot.val() || {};
                for (const [id, fish] of Object.entries(allFishes)) {
                    if (previous[id]) { fish._x = previous[id]._x; fish._y = previous[id]._y; }
                }
                let count = 0;
                for (const uid in allFishes) {
                    const f = allFishes[uid]; count++;
                    if (f._x == null) f._x = Math.random() * (aqW || 300);
                    if (f._y == null) f._y = 60 + Math.random() * Math.max(1, (aqH || 300) - 140);
                    if (f.dirX == null) f.dirX = 1;
                    if (f.dirY == null) f.dirY = 0;
                    
                    if (uid === myUid && f.bornAt) {
                        f.size = calcFishSize(f.bornAt);
                    }
                }
                if (aqFishCount) aqFishCount.textContent = `🐟 ${count} 隻魚`;
            });
        }

        async function loadMyFeedTime() {
            if (!myUid) return;
            try {
                const snap = await get(ref(db, `aquarium/feedLogs/${myUid}`));
                if (snap.exists()) {
                    myLastFedAt = snap.val().lastFedAt || 0;
                } else {
                    myLastFedAt = 0;
                }
                checkFeedCooldown();
            } catch(e) { console.warn(e); }
        }

        feedFishBtn.addEventListener('click', async () => {
            if (feedFishBtn.disabled) return;
            if (liveFoods[myUid]) return;

            try {
                await set(ref(db, `aquarium/foods/${myUid}`), {
                    ownerUid: myUid, x: 0.15 + Math.random() * 0.7,
                    y: 0.2 + Math.random() * 0.5, createdAt: Date.now()
                });
            } catch (error) { alert('餵食失敗：' + error.message); return; }

            const now = Date.now();
            myLastFedAt = now;
            checkFeedCooldown();

            try {
                await set(ref(db, `aquarium/feedLogs/${myUid}`), { lastFedAt: now });
            } catch(e) { console.warn("無法記錄餵食時間", e); }
        });

        setInterval(checkFeedCooldown, 60000);

        function drawAquarium(t) {
            const g = aqCtx.createLinearGradient(0, 0, 0, aqH);
            g.addColorStop(0, '#0a4d68'); g.addColorStop(1, '#03202e');
            aqCtx.fillStyle = g; aqCtx.fillRect(0, 0, aqW, aqH);

            aqCtx.save(); aqCtx.globalAlpha = 0.08; aqCtx.fillStyle = '#aef';
            for (let i = 0; i < 5; i++) {
                aqCtx.beginPath(); aqCtx.moveTo(aqW * 0.1 + i * aqW * 0.18, 0); aqCtx.lineTo(aqW * 0.18 + i * aqW * 0.18, 0);
                aqCtx.lineTo(aqW * 0.26 + i * aqW * 0.18, aqH); aqCtx.lineTo(aqW * 0.1 + i * aqW * 0.18, aqH); aqCtx.closePath(); aqCtx.fill();
            }
            aqCtx.restore();

            const sg = aqCtx.createLinearGradient(0, aqH - 60, 0, aqH);
            sg.addColorStop(0, '#c2a878'); sg.addColorStop(1, '#8a7350');
            aqCtx.fillStyle = sg; aqCtx.beginPath(); aqCtx.moveTo(0, aqH - 40);
            for (let x = 0; x <= aqW; x += 50) aqCtx.lineTo(x, aqH - 40 + Math.sin(x / 70) * 8);
            aqCtx.lineTo(aqW, aqH); aqCtx.lineTo(0, aqH); aqCtx.closePath(); aqCtx.fill();

            aqCtx.strokeStyle = '#2e8b57'; aqCtx.lineWidth = 6; aqCtx.lineCap = 'round';
            aqPlants.forEach(p => {

                const sway = Math.sin(t / 800 + p.phase) * 15;
                aqCtx.quadraticCurveTo(p.x + sway, aqH - p.h * 0.6, p.x + sway * 1.5, aqH - p.h); aqCtx.stroke();
            });

            aqCtx.fillStyle = 'rgba(200,240,255,0.6)';
            aqBubbles.forEach(b => {
                b.y -= b.s; b.x += Math.sin(t / 300 + b.y / 50) * 0.3;
                if (b.y < -10) { b.y = aqH + 10; b.x = Math.random() * aqW; }
                aqCtx.beginPath(); aqCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2); aqCtx.fill();
            });

            for (const food of Object.values(liveFoods)) {
                aqCtx.save(); aqCtx.font = '26px sans-serif';
                aqCtx.textAlign = 'center'; aqCtx.textBaseline = 'middle';
                aqCtx.fillText('🍞', food.x * aqW, food.y * aqH); aqCtx.restore();
            }

            for (const uid in allFishes) {
                const f = allFishes[uid];
                if (f._x == null) f._x = Math.random() * aqW;
                if (f._y == null) f._y = 60 + Math.random() * Math.max(1, aqH - 140);
                if (f.dirX == null) f.dirX = 1;
                if (f.dirY == null) f.dirY = 0;
                if (f.turnCooldown == null) f.turnCooldown = 0;

                let isChasing = false;
                const food = liveFoods[uid];
                if (food) {
                    isChasing = true;
                    const dx = food.x * aqW - f._x, dy = food.y * aqH - f._y;
                    const distance = Math.hypot(dx, dy);
                    const step = Math.min(4, distance);
                    if (distance > 0) {
                        f._x += dx / distance * step;
                        f._y += dy / distance * step;
                        f.dirX = dx < 0 ? -1 : 1;
                    }
                    if (distance < 10 && uid === myUid && !food._removing) {
                        food._removing = true;
                        remove(ref(db, `aquarium/foods/${uid}`)).catch(error => {
                            food._removing = false; console.warn(error);
                        });
                    }
                }

                if (!isChasing) {
                    f.turnCooldown--;
                    if (f.turnCooldown <= 0) {
                        if (Math.random() < 0.1) f.dirX = Math.random() < 0.5 ? 1 : -1;
                        if (Math.random() < 0.2) f.dirY = (Math.random() - 0.5) * 0.8;
                        f.turnCooldown = 30 + Math.random() * 60;
                    }

                    f._x += (f.speed || 1) * f.dirX;
                    f._y += (f.speed || 1) * f.dirY + Math.sin(t / 500 + (f.phase || 0)) * 0.5;
                }

                if (f._x < 20) { f._x = 20; f.dirX = 1; }
                if (f._x > aqW - 20) { f._x = aqW - 20; f.dirX = -1; }
                if (f._y < 30) { f._y = 30; f.dirY = Math.abs(f.dirY) || 0.5; }
                if (f._y > aqH - 50) { f._y = aqH - 50; f.dirY = -Math.abs(f.dirY) || -0.5; }
                if (f.dirX === 0 && f.dirY === 0) f.dirX = 1;

                const s = calcFishSize(f.bornAt);
                aqCtx.save(); 
                aqCtx.translate(f._x, f._y); 
                aqCtx.scale(f.dirX || 1, 1);

                const speciesInfo = tankSpecies.find(item => item.id === f.species);
                if (speciesInfo) {
                    aqCtx.scale(-1, 1);
                    aqCtx.font = `${s * 2.8}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                    aqCtx.textAlign = 'center'; aqCtx.textBaseline = 'middle';
                    aqCtx.fillText(speciesInfo.icon, 0, 0);
                } else {
                const tail = Math.sin(t / 150 + (f.phase || 0)) * 4;
                aqCtx.fillStyle = f.color || '#4af';
                aqCtx.beginPath(); aqCtx.moveTo(-s, 0); aqCtx.lineTo(-s * 1.8, -s * 0.6 + tail); aqCtx.lineTo(-s * 1.8, s * 0.6 + tail); aqCtx.closePath(); aqCtx.fill();

                aqCtx.beginPath(); aqCtx.ellipse(0, 0, s, s * 0.55, 0, 0, Math.PI * 2); aqCtx.fill();

                aqCtx.fillStyle = '#fff'; aqCtx.beginPath(); aqCtx.arc(s * 0.5, -s * 0.15, s * 0.18, 0, Math.PI * 2); aqCtx.fill();
                aqCtx.fillStyle = '#000'; aqCtx.beginPath(); aqCtx.arc(s * 0.55, -s * 0.15, s * 0.08, 0, Math.PI * 2); aqCtx.fill();

                }
                aqCtx.restore();

                if (f.ownerName) {
                    aqCtx.save(); aqCtx.font = 'bold 12px sans-serif'; aqCtx.textAlign = 'center';
                    if (uid === myUid) aqCtx.fillStyle = '#ffe066';
                    else aqCtx.fillStyle = 'rgba(255,255,255,0.85)';
                    aqCtx.fillText(f.ownerName, f._x, f._y - s - 6); aqCtx.restore();
                }
            }
            aquariumAnimId = requestAnimationFrame(drawAquarium);
        }

        aquariumCanvas.addEventListener('click', () => { if (isAdmin) aButton.click(); });

        async function openAquarium() {
            aquariumWindow.style.display = 'flex';

        function closeAquarium() {

function aAccess(){aButton.style.display=auth.currentUser&&isAdmin?'inline-block':'none';if(!auth.currentUser||!isAdmin)aClose();}onAuthStateChanged(auth,aAccess);loginBtn.addEventListener('click',aAccess);logoutBtn.addEventListener('click',aClose);
async function aRun(fn){if(!isAdmin||!myUid||aBusy)return;aBusy=true;aGrid.querySelectorAll('button,input').forEach(b=>b.disabled=true);try{await fn();}catch(e){alert(e.message);}finally{aBusy=false;aRender();}}
function aBtn(text,cls,fn){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.disabled=aBusy;b.onclick=()=>aRun(fn);return b;}
async function aSetAge(uid,days){if(!Number.isInteger(days)||days<0||days>36500)throw Error('請輸入0～36500的整數天數');const r=ref(db,`aquarium/fishes/${uid}`);if(!(await get(r)).exists())throw Error('魚已不存在');const bornAt=Date.now()-days*aDay;await update(r,{bornAt,size:calcFishSize(bornAt)});}
async function aShift(uid,n){const snap=await get(ref(db,`aquarium/fishes/${uid}`));if(!snap.exists())throw Error('魚已不存在');await aSetAge(uid,Math.max(0,Math.min(36500,aAge(snap.val())+n)));}
function aRender(){if(aGrid.contains(document.activeElement)&&document.activeElement.matches('input')&&!aBusy)return;aGrid.replaceChildren();if(!Object.keys(aData).length){aGrid.textContent='目前沒有魚';return;}for(const [uid,f] of Object.entries(aData)){const card=document.createElement('article');card.className='a-card';const name=document.createElement('p');name.textContent='魚主人：'+(f.ownerName||'未命名玩家');name.style.fontWeight='bold';const age=document.createElement('p');age.textContent='魚齡：'+aAge(f)+' 天';const bio=tankSpecies.find(b=>b.id===f.species),type=document.createElement('p');type.textContent='品種：'+(bio?bio.icon+' '+bio.name:'原本彩色魚');const reset=aBtn('取消今日餵食，允許重新餵食','a-reset',async()=>{if(confirm('取消餵食並允許重新餵食？'))await update(ref(db),{[`aquarium/feedLogs/${uid}`]:null,[`aquarium/foods/${uid}`]:null});});const label=document.createElement('p');label.textContent='調整魚齡';const row=document.createElement('div');row.className='a-row';const input=document.createElement('input');input.type='number';input.min='0';input.max='36500';input.step='1';input.value=String(aAge(f));input.disabled=aBusy;input.setAttribute('aria-label','魚齡天數');input.onchange=()=>{const days=Number(input.value);if(input.value.trim()===''||!Number.isInteger(days)||days<0||days>36500){alert('請輸入0～36500的整數天數');input.value=String(aAge(f));return;}if(days!==aAge(f))aRun(()=>aSetAge(uid,days));};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}};const unit=document.createElement('span');unit.textContent='天';row.append(aBtn('−1 天','',()=>aShift(uid,-1)),input,unit,aBtn('＋1 天','',()=>aShift(uid,1)));const del=aBtn('🗑️ 刪除這隻魚','a-delete',async()=>{if(confirm('確定刪除這隻魚？原資料無法復原。'))await update(ref(db),{[`aquarium/fishes/${uid}`]:null,[`aquarium/foods/${uid}`]:null});});card.append(name,age,type,reset,label,row,del);aGrid.append(card);}}
aButton.onclick=()=>{if(!isAdmin||!myUid)return;aClose();aOverlay.style.display='flex';aGrid.textContent='載入中…';aUnsub=onValue(ref(db,'aquarium/fishes'),snap=>{aData=snap.val()||{};aRender();},e=>{aGrid.textContent=e.message;});};aOverlay.querySelector('footer button').onclick=aClose;aOverlay.onclick=e=>{if(e.target===aOverlay)aClose();};document.addEventListener('keydown',e=>{if(e.key==='Escape')aClose();});aAccess();

</script>
</body>
</html>
